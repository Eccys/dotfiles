# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

# ───────── MASTER QUICKSHELL CONTAINER ─────────
windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}

# ───────── 3D Aim Trainer (Steam 1600530 / Proton) ─────────
# Electron lobby + Unity client share class steam_app_1600530.
# Unity must be real-fullscreen on DP-3 or Hyprland tiles it (~1268x1376).
windowrule {
    name = "3dat_all"
    match:class = ^(steam_app_1600530)$
    monitor = DP-3
    workspace = 4
    content = game
    no_anim = on
    float = on
    size = 2560 1440
    move = 0 0
    fullscreen = on
}

windowrule {
    name = "3dat_unity"
    match:class = ^(steam_app_1600530)$
    match:title = ^(3D Aim Trainer)$
    fullscreen = on
    stay_focused = on
}

windowrule {
    name = "3dat_lobby"
    match:class = ^(steam_app_1600530)$
    match:title = ^(3D Aim Trainer - )
    fullscreen = on
    no_initial_focus = on
}

windowrule {
    name = "3dat_winedesktop"
    match:class = ^(steam_app_1600530)$
    match:title = ^(Wine Desktop)$
    fullscreen = on
    stay_focused = on
}

# Screenshot tools must stay above the desktop, outside the tiled layout.
windowrule {
    name = screenshot_editors
    match:class = ^(flameshot|ksnip|com.gabm.satty|satty|snapx-ui|snapx-overlay)$
    float = on
    center = on
    no_anim = on
}
windowrule {
    name = flameshot_capture_overlay
    match:class = ^(flameshot)$
    match:title = ^(flameshot)$
    move = 0 0
    no_blur = on
    no_shadow = on
}
