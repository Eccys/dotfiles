# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Mouse wheel left/right to change workspace (including empty workspaces)
bind = $mainMod, mouse_left, workspace, e-1
bind = $mainMod, mouse_right, workspace, e+1

# ───────── Window Management ─────────
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, forcekillactive,
bind = ALT, F4, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,

# ───────── Focus — Arrows ─────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ───────── Focus — Vim (HJKL) ─────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ───────── Resize — Win+Shift+Arrows ─────────
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# ───────── Resize — Win+Shift+HJKL ─────────
binde = $mainMod SHIFT, H, resizeactive, -50 0
binde = $mainMod SHIFT, L, resizeactive, 50 0
binde = $mainMod SHIFT, K, resizeactive, 0 -50
binde = $mainMod SHIFT, J, resizeactive, 0 50

# ───────── Move Window — Win+Ctrl+Arrows ─────────
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# ───────── Move Window — Win+Ctrl+HJKL ─────────
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# ───────── Workspaces — Switch (via qs_manager) ─────────
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/monitor-workspace.sh 1 switch
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/monitor-workspace.sh 2 switch
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/monitor-workspace.sh 3 switch
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/monitor-workspace.sh 4 switch
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/monitor-workspace.sh 5 switch

# ───────── Workspaces — Move Window + Follow (via qs_manager) ─────────
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/monitor-workspace.sh 1 move
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/monitor-workspace.sh 2 move
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/monitor-workspace.sh 3 move
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/monitor-workspace.sh 4 move
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/monitor-workspace.sh 5 move

# ───────── Workspaces — Move Window Silently ─────────
bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/monitor-workspace.sh 1 silent
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/monitor-workspace.sh 2 silent
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/monitor-workspace.sh 3 silent
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/monitor-workspace.sh 4 silent
bind = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/monitor-workspace.sh 5 silent

# ───────── Workspace Navigation ─────────
bind = $mainMod, Tab, exec, ~/.config/hypr/scripts/monitor-workspace.sh previous
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# ───────── Special Workspace ─────────
bind = $mainMod, R, togglespecialworkspace,
# Disabled: Win+Shift+R is reserved for reload.
# bind = $mainMod SHIFT, R, movetoworkspace, special
bind = $mainMod CTRL, R, movetoworkspacesilent, special

# ───────── Applications ─────────
bind = $mainMod, W, exec, zen-browser
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, nautilus
bind = $mainMod SHIFT, Return, exec, pypr toggle term

# ───────── Quickshell Widgets ─────────
bind = $mainMod, D, exec, @HOME@/.local/bin/serpantinum msg toggle launcher
bindd = $mainMod, B, Toggle bar, exec, @HOME@/.local/bin/serpantinum msg toggle autohide
bind = $mainMod SHIFT, M, exec, @HOME@/.local/bin/serpantinum msg toggle music
bind = $mainMod SHIFT, W, exec, @HOME@/.local/bin/serpantinum msg toggle wallpaper
bind = $mainMod SHIFT, B, exec, @HOME@/.local/bin/serpantinum msg toggle battery
bind = $mainMod, V, exec, @HOME@/.local/bin/serpantinum msg toggle clipboard
bind = $mainMod, Period, exec, pkill fuzzel || @HOME@/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy
bind = $mainMod SHIFT, V, exec, @HOME@/.local/bin/serpantinum msg toggle volume
bind = $mainMod, N, exec, @HOME@/.local/bin/serpantinum msg toggle network
bind = $mainMod, S, exec, @HOME@/.local/bin/serpantinum msg toggle calendar
bind = $mainMod, M, exec, @HOME@/.local/bin/serpantinum msg toggle guide display
bind = $mainMod, P, exec, @HOME@/.local/bin/serpantinum msg toggle movies
bind = $mainMod SHIFT, S, exec, @HOME@/.local/bin/serpantinum msg toggle guide general
bind = $mainMod SHIFT, T, exec, @HOME@/.local/bin/serpantinum msg toggle guide wellbeing
bind = $mainMod, Slash, exec, @HOME@/.local/bin/serpantinum msg toggle guide
bind = $mainMod, A, exec, @HOME@/.local/bin/serpantinum msg toggle system
bind = $mainMod SHIFT, R, exec, bash @HOME@/.local/share/serpantinum/src/scripts/reload.sh

# ───────── System ─────────
bindl = CTRL, Space, exec, playerctl play-pause
bind = CTRL ALT, L, exec, bash @HOME@/.local/share/serpantinum/src/scripts/lock.sh
bind = $mainMod ALT, L, exec, bash @HOME@/.local/share/serpantinum/src/scripts/lock.sh
bindl = , XF86PowerOff, exec, bash @HOME@/.local/share/serpantinum/src/scripts/lock.sh

# ───────── Media & Hardware Keys ─────────
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, bash @HOME@/.local/share/serpantinum/src/scripts/volume.sh mic-toggle
bindl = , xf86audiomute, exec, bash @HOME@/.local/share/serpantinum/src/scripts/volume.sh mute-toggle
bindel = , xf86audiolowervolume, exec, bash @HOME@/.local/share/serpantinum/src/scripts/volume.sh lower
bindel = , xf86audioraisevolume, exec, bash @HOME@/.local/share/serpantinum/src/scripts/volume.sh raise
bindl = , XF86MonBrightnessDown, exec, bash @HOME@/.local/share/serpantinum/src/scripts/brightness.sh lower
bindl = , XF86MonBrightnessUp, exec, bash @HOME@/.local/share/serpantinum/src/scripts/brightness.sh raise

# ───────── SnapX / Windows ShareX workflow ─────────
bindl = , Print, exec, ~/.local/bin/snapx-workflow full
bindl = ALT, Print, exec, ~/.local/bin/snapx-workflow window
bindl = CTRL SHIFT, S, exec, ~/.local/bin/snapx-workflow region
bindl = CTRL SHIFT, Z, exec, ~/.local/bin/snapx-workflow record
bindl = CTRL SHIFT, Print, exec, ~/.local/bin/snapx-workflow gif
bindl = CTRL SHIFT, Q, exec, ~/.local/bin/snapx-workflow ocr
bindl = CTRL ALT, Q, exec, ~/.local/bin/snapx-workflow qr
bindl = SHIFT, Print, exec, ~/.local/bin/snapx-workflow edit
bindl = SUPER, Print, exec, ~/.local/bin/snapx-workflow full
bindl = SUPER SHIFT, Print, exec, ~/.local/bin/snapx-workflow app


# Manual root and home snapshots
bind = $mainMod CTRL SHIFT, R, exec, @HOME@/.local/bin/manual-snapshot root
bind = $mainMod CTRL SHIFT, H, exec, @HOME@/.local/bin/manual-snapshot home

# Global OBS recording controls
bind = CTRL SHIFT, 1, exec, ~/.local/bin/obs-control record
bind = CTRL SHIFT, 2, exec, ~/.local/bin/obs-control pause
